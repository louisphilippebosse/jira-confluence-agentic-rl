
  services:
    backend:
      build: .
      image: jira-confluence-backend
      container_name: backend
      ports:
        - "8000:8000"
      env_file:
        - .env
      volumes:
        - ./data:/app/data
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "python", "-c", "import requests; r = requests.get('http://localhost:8000/health', timeout=5); exit(0 if r.status_code == 200 else 1)"]
        interval: 30s
        timeout: 10s
        retries: 3
      networks:
        - app-network

    frontend:
      build:
        context: ./frontend
      image: jira-confluence-frontend
      container_name: frontend
      ports:
        - "3000:80"
      restart: unless-stopped
      networks:
        - app-network

    ollama:
      image: ollama/ollama:latest
      container_name: ollama
      ports:
        - "11434:11434"
      volumes:
        - ./ollama/ollama:/root/.ollama
        - ./entrypoint.sh:/entrypoint.sh
      pull_policy: always
      tty: true
      restart: always
      entrypoint: ["/usr/bin/bash", "/entrypoint.sh"]
      networks:
        - app-network
      env_file:
        - .env

  networks:
    app-network:
      driver: bridge

  volumes:
    ollama_data:
